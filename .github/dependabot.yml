version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Additional observed ecosystems; existing policies above are preserved.
  - package-ecosystem: nuget
    directories:
      - /code/src/Attendee
      - /code/src/AttendeeSite
      - /code/test/AttendeeTest
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-minor-and-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /code/src/AttendeeSite
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-minor-and-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
